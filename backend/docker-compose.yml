# Lance toute l'application : docker compose up --build
# Les variables sont lues dans backend/.env (voir .env.example).
services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

  users:
    build: ./services/users
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/ascendia
      PORT_USERS: 3001
    depends_on: [mongodb]

  socialauth:
    build: ./services/socialAuth
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/ascendia
      PORT_SOCIALAUTH: 3002
    depends_on: [mongodb]

  posts:
    build: ./services/posts
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/ascendia
      PORT_POSTS: 3003
      SOCIALAUTH_URL: http://socialauth:3002
    ports:
      - "3003:3003"
    depends_on: [mongodb, socialauth]

  gateway:
    build: ./gateway
    env_file: .env
    environment:
      PORT_GATEWAY: 3000
      PROXY_USERS: http://users:3001
      PROXY_SOCIALAUTH: http://socialauth:3002
      PROXY_POSTS: http://posts:3003
    ports:
      - "3000:3000"
    depends_on: [users, socialauth, posts]

  frontend:
    build:
      context: ../frontend/reactJS
    ports:
      - "8080:80"
    depends_on: [gateway]

volumes:
  mongodb_data:
